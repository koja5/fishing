<div *ngIf="managementRegistersData && managementRegistersData.length">
    <div class="row">
        <div class="alert-message col-md-12 text-center" *ngIf="filter.managementRegisterId">
            <div *ngIf="fishStockingReport && fishStockingReport.status === fishStockingReportEnum.completed">
                <ngb-alert [type]="'success'" [dismissible]="false">
                    <div class="alert-body">{{'actionMessage.reportCompleted' | translate}}
                        {{fishStockingReport.date_completed | date: 'dd.MM.yyyy. HH:mm'}}</div>
                </ngb-alert>
            </div>
            <div *ngIf="data && data.length && (!fishStockingReport || fishStockingReport.status ===
                fishStockingReportEnum.draft)">
                <ngb-alert [type]="'warning'" [dismissible]="false">
                    <div class="alert-body">{{'actionMessage.reportCompletedNotYet' | translate}}</div>
                </ngb-alert>
            </div>
            <div class="explanation">
                <app-explanation-mark [mainExplanation]="'fishStocking.mainExplanation'"></app-explanation-mark>
            </div>
        </div>
        <div class="full-width row m-auto pb-1">
            <div class="col-md-3">
                <label>{{'commonFields.fbz' | translate}} <app-explanation-mark
                        [explanation]="'fishStocking.explanation'"></app-explanation-mark></label>
                <ng-select [items]="managementRegistersData" bindLabel="fbz" bindValue="id"
                    [(ngModel)]="filter.managementRegisterId"
                    [placeholder]="'commonFields.chooseManagementRegistry' | translate" (change)="onChange($event)"
                    [searchable]="true">
                    <ng-template ng-label-tmp let-item="item" let-clear="clear">
                        <span>{{item.fbz}} - {{item.year}}</span>
                    </ng-template>
                    <ng-template ng-value-tmp let-item="item">
                        <span>{{item.fbz}} - {{item.year}}</span>
                    </ng-template>
                    <ng-template ng-option-tmp let-item="item">
                        <span>{{item.fbz}} - {{item.year}}</span>
                    </ng-template>
                </ng-select>

            </div>
            <div class="col-md-9"
                *ngIf="isReportEditable || (filter.managementRegister && filter.managementRegister.editable)">
                <div class="d-flex justify-content-end action">
                    <div class="d-flex" *ngIf="filter.managementRegisterId">
                        <button
                            *ngIf="data && data.length && (!fishStockingReport || fishStockingReport.status === fishStockingReportEnum.draft)"
                            class="btn btn-success mb-1" (click)="completeReports()"><span class="fa fa-check"></span>
                            {{'action.completeReport' |
                            translate}}</button>

                        <button
                            *ngIf="fishStockingReport && fishStockingReport.status === fishStockingReportEnum.completed"
                            class="btn btn-primary mb-1 mr-1" (click)="requestForAdditionalChanges()"><span
                                class="fa fa-question-circle-o"></span>
                            {{'action.requestAdminToChangeStatus' |
                            translate}}</button>

                        <button
                            *ngIf="!fishStockingReport || fishStockingReport.status !== fishStockingReportEnum.completed"
                            class="btn btn-outline-danger mb-1 ml-1 mr-1"
                            (click)="noHaveFishStockingEntryDialog()"><span class="fa fa-times"></span>
                            {{'action.noHaveEntry' |
                            translate}}</button>
                    </div>

                    <app-generate-pdf-report [path]="path" [file]="fileExportReport"
                        [groupBy]="'fbz'"></app-generate-pdf-report>
                </div>

            </div>
        </div>
    </div>

    <app-no-data *ngIf="!filter.managementRegister" [text]="('general.selectFbzToGetData' | translate)"
        [image]="'../../../assets/images/icons/filter.png'"></app-no-data>

    <div *ngIf="filter.managementRegister">
        <app-dynamic-grid #grid *ngIf="!loading" [path]="path" [file]="file" [fileExportReport]="fileExportReport"
            [data]="data" [additionalData]="selectedRegistry" [height]="'calc(100vh - 32vh)'" (submit)="submit($event)"
            (refreshParentComponent)="refreshGrid()"
            [disableCRUD]="(fishStockingReport && fishStockingReport.status === fishStockingReportEnum.completed) || (!isReportEditable && (filter.managementRegister && !filter.managementRegister.editable))"></app-dynamic-grid>
    </div>
</div>

<app-loader *ngIf="loading"></app-loader>

<app-no-data *ngIf="(!managementRegistersData || !managementRegistersData.length) && !loading"
    [text]="('general.noManagementRegisterForYou' | translate)"
    [image]="'../../../assets/images/icons/no-data-for-user.png'"></app-no-data>

<app-dialog-confirm #dialogConfirm [title]="('actionMessage.dialogCompleteReportQuestionTitle' | translate)"
    [content]="('actionMessage.dialogCompleteReportQuestionText' | translate)"
    [confirmButtonText]="('actionMessage.dialogCompleteReportQuestionYes' | translate)"
    [cancelButtonText]="('actionMessage.dialogCompleteReportQuestionNo' | translate)"
    (confirm)="showQuestionForConfirmReport()"></app-dialog-confirm>

<app-dialog-confirm #dialogConfirmForShareData
    [title]="('actionMessage.dialogCompleteReportQuestionForShareDataTitle' | translate)"
    [content]="('actionMessage.dialogCompleteReportQuestionForShareDataText' | translate)"
    [confirmButtonText]="('actionMessage.dialogCompleteReportQuestionForShareDataYes' | translate)"
    [cancelButtonText]="('actionMessage.dialogCompleteReportQuestionForShareDataNo' | translate)"
    [hideCloseButton]="true" [disableOutsideClose]="true" (confirm)="confirmCompleteReportAndShareData()"
    (cancel)="confirmCompleteReportAndNoShareData()"></app-dialog-confirm>


<app-dialog-confirm #dialogNoHaveEntry [title]="('actionMessage.dialogNoHaveReportsTitle' | translate)"
    [content]="('actionMessage.dialogNoHaveReportsText' | translate)"
    [confirmButtonText]="('generalDialog.yes' | translate)" [cancelButtonText]="('generalDialog.no' | translate)"
    (confirm)="showQuestionForNoHaveEntry()"></app-dialog-confirm>

<app-dialog-confirm #dialogConfirmNoHaveEntryForShareData
    [title]="('actionMessage.dialogCompleteReportQuestionForShareDataTitle' | translate)"
    [content]="('actionMessage.dialogCompleteReportQuestionForShareDataText' | translate)"
    [confirmButtonText]="('actionMessage.dialogCompleteReportQuestionForShareDataYes' | translate)"
    [cancelButtonText]="('actionMessage.dialogCompleteReportQuestionForShareDataNo' | translate)"
    [hideCloseButton]="true" [disableOutsideClose]="true" (confirm)="confirmNoHaveEntryAndShareData()"
    (cancel)="confirmNoHaveEntryAndNoShareData()"></app-dialog-confirm>

<app-dialog-confirm #dialogRequestForAdditionalChanges
    [title]="('actionMessage.dialogRequestForAdditionalChangesTitle' | translate)"
    [content]="('actionMessage.dialogRequestForAdditionalChangesText' | translate)"
    [confirmButtonText]="('generalDialog.yes' | translate)" [cancelButtonText]="('generalDialog.no' | translate)"
    (confirm)="requestToAdminForAdditionalChanges()"></app-dialog-confirm>
